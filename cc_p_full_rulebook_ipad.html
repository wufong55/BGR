    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
    }
    .rule-highlight {
      animation: pulseGold 2.4s ease-out;
      border-color: #f59e0b !important;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.35);
    }
    @keyframes pulseGold {
      0% { background-color: rgba(245, 158, 11, 0.28); }
      100% { background-color: rgba(30, 41, 59, 0.9); }
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* === iPad / 平板 桌邊大字與 45 歲以上高辨識度優化 === */
    html {
      font-size: 18px;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    @media (min-width: 768px) {
      html {
        font-size: 19px; /* 平板桌邊視距預設放大 (+19%) */
      }
    }
    html.ipad-font-lg { font-size: 21.5px !important; } /* A+ 大字模式 (+35%) */
    html.ipad-font-xl { font-size: 24.5px !important; } /* A++ 特大模式 (+53%) */

    /* 針對45歲以上閱覽強化：消除微縮字體，確保內文、標註與條號清晰好讀 */
    .text-\[10px\], .text-\[11px\] {
      font-size: 0.82rem !important; /* ~15.5px */
      line-height: 1.45 !important;
    }
    .text-xs {
      font-size: 0.88rem !important; /* ~16.7px */
      line-height: 1.5 !important;
    }
    .text-sm {
      font-size: 0.98rem !important; /* ~18.6px */
      line-height: 1.6 !important;
    }
    .text-base {
      font-size: 1.08rem !important; /* ~20.5px */
      line-height: 1.65 !important;
    }

    /* 提升文字對比度，減輕昏暗桌遊環境下眼睛疲倦 */
    .text-slate-400 {
      color: #cbd5e1 !important; /* 提升至 Slate-300 高對比 */
    }
    .text-slate-500 {
      color: #94a3b8 !important; /* 提升至 Slate-400 */
    }
    p, li, dd {
      line-height: 1.65 !important;
    }
    body {
      padding-bottom: calc(4.75rem + env(safe-area-inset-bottom, 0px));
      -webkit-tap-highlight-color: transparent;
    }
    button, a, input, select {
      touch-action: manipulation;
    }
    /* Prevent iPad Safari auto-zoom on input focus */
    input[type="text"], input[type="search"], input[type="number"], select {
      font-size: 16px !important;
    }
    /* Apple HIG >= 44pt touch targets for category jump & index pills */
    .sec-jump-btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
    }
    .inline-ref-btn {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
    }
    /* iPad Portrait Slide-Over Sidebar Drawer */
    @media (max-width: 1023px) {
      #tocSidebarAside {
        display: none;
      }
      #tocSidebarAside.ipad-drawer-open {
        display: block !important;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(360px, 86vw);
        z-index: 60;
        background: #0f172a;
        border-right: 2px solid rgba(245, 158, 11, 0.5);
        box-shadow: 16px 0 40px rgba(0, 0, 0, 0.75);
        padding: 1rem;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
    }

  </style>

  <script>
    const CCP_DATA = {"meta": {"title_zh": "戰鬥指揮官：太平洋 (Combat Commander: Pacific)", "title_en": "Combat Commander: Vol. III – Pacific (CC:P)", "publisher": "GMT Games, LLC (2008) · 設計師：Chad Jensen", "scale": "每六角格約 30 公尺 (100 英尺) · 單兵=領袖 / 3–6人=班組(Team) / 8–13人=步兵班(Squad)", "golden_rule": "黃金法則 [1.0]：卡牌效果或劇本特殊規則與基本規則衝突時，卡牌／劇本特殊規則永遠優先。詮釋原則：「規則字面說什麼就是什麼，切勿自行推論延伸 (Do not infer or imagine more to a rule than is stated in it)。」"}, "faq_errata": [{"id": "FAQ-1", "target": "Playbook – 視線 (LOS) 範例 Figure 1", "title": "劇本書視線範例圖片勘誤", "detail": "最終印刷版的 Figure 1 在 J2–K3 六角格邊上誤印了兩棵棕櫚樹圖示，導致該範例 D 段的說明失效（實際判定請依規則書 T89 與 16 節為準）。"}, {"id": "FAQ-2", "target": "Playbook – 開火攻擊 (Fire Attack) 範例", "title": "劇本書開火攻擊範例數值修正", "detail": "範例 E 段中重機槍 (HMG) 的基礎火力 (FP) 應為「9」（而非 8），但此修正不影響該段範例後續的計算或結算結果。"}, {"id": "FAQ-3", "target": "卡牌 A-3、C-31、C-32 (Event: Stealth)", "title": "事件名稱勘誤：Low Crawl 應為 Stealth [E75]", "detail": "卡牌 A-3、C-31 與 C-32 上的事件名稱應為「Stealth（潛行）」，而非舊稱「Low Crawl（低姿匍匐）」。其遊戲效果完全照卡面文字與規則 [E75] 執行。"}, {"id": "FAQ-4", "target": "劇本 D (Scenario D) 特殊規則 1", "title": "劇本 D 隨機格抽取數量修正", "detail": "劇本 D 的特殊規則 1 (Special Rule 1) 應規定每位玩家抽取「6 個 (six)」隨機格（而非 9 個）。"}], "postures": [{"id": "17.4", "name_zh": "登陸者", "name_en": "Invader", "hand_size": 7, "special": "手牌上限 7 張。通常將至少一半的初始兵力配置於「時間軌 (Time Track)」作為後續增援，且友方地圖邊緣多由水障與沙灘格組成。"}, {"id": "17.1", "name_zh": "攻擊者", "name_en": "Attacker", "hand_size": 6, "special": "手牌上限 6 張。標準進攻態勢，無額外特殊規則限制。"}, {"id": "17.5", "name_zh": "偵察", "name_en": "Recon", "hand_size": 5, "special": "手牌上限 5 張。注意：任何態勢皆可打出「偵察 (Reconnoiter [O30])」指令，並非偵察態勢專屬。"}, {"id": "17.3", "name_zh": "防禦者", "name_en": "Defender", "hand_size": 4, "special": "手牌上限 4 張。(1) 可打出防禦者專屬行動（A35 歸零射擊、A43.1–A43.7 各類隱藏工事與隱藏單位）；(2) 每次執行「時間推進 [13.1.2]」時自動獲得 1 VP。"}, {"id": "17.2", "name_zh": "萬歲衝鋒", "name_en": "Banzai (日軍專屬)", "hand_size": 3, "special": "手牌上限 3 張（可由劇本指定或透過 E78 天皇陛下萬歲！事件切換）。(1) 可打出「衝鋒 (Charge [O25])」指令；(2) 被消滅的非英雄日軍單位（含攜帶武器）不進傷亡軌，而是直接放到「時間軌的下一格」作為後續增援再次登場（盟軍仍照常獲得消滅 VP）！"}], "discard_limits": [{"faction": "美軍 (US)", "day": 5, "night": 2, "color": "amber"}, {"faction": "英聯邦 (Commonwealth)", "day": 4, "night": 2, "color": "yellow"}, {"faction": "日軍 (Japan)", "day": 3, "night": 2, "color": "rose"}], "triggers": [{"id": "1.9.2", "name_zh": "消散觸發", "name_en": "Disperse Trigger", "badge": "Disperse", "timing": "擲骰結果帶有紅框「Disperse」時，在套用該次擲骰結果前立即執行", "effect": "擲骰玩家必須從地圖上移除 1 個「煙霧 (Smoke)」標記（放回抽袋）或 1 個「照明彈 (Starshell)」標記（放回配件池）。"}, {"id": "1.9.3", "name_zh": "事件觸發", "name_en": "Event Trigger", "badge": "Event", "timing": "擲骰結果帶有紅框「Event」時，暫停當前結算立即執行", "effect": "擲骰玩家翻開自己抽牌堆頂牌，忽略卡面其他部分，大聲朗讀並執行「事件 (Event [E50–E80])」。除非事件另有規定，所有決策皆由翻開該事件的玩家決定。若事件中需抽隨機格，結算完後記得觸發 [1.8.2] 移動日軍目擊標記。"}, {"id": "1.9.4", "name_zh": "狙擊手觸發", "name_en": "Sniper Trigger", "badge": "Sniper", "timing": "擲骰結果帶有紅框「Sniper」時，暫停當前結算立即執行", "effect": "擲骰玩家翻開自己抽牌堆頂牌，僅查看左下角「隨機格 (Random Hex)」。該玩家可選擇該格或相鄰格內的 1 個單位（敵我皆可）使其「崩潰 (Break)」（若原本已崩潰則直接消滅！）。結算完畢後，日軍必須將場上 1 個「目擊標記 (Sighting Marker)」移入該隨機格 [1.8.2]。"}, {"id": "1.9.5", "name_zh": "時間觸發", "name_en": "Time Trigger", "badge": "Time", "timing": "擲骰結果帶有紅框「Time」或任一玩家抽牌堆抽空時立即執行", "effect": "時間標記前進 1 格 [13.1.2]：(a) 觸發玩家將自己的抽牌堆與棄牌堆重洗成新抽牌堆；(b) 若時間標記進入或超過驟死格，觸發玩家擲驟死檢定（骰數 < 當前時間格數字則遊戲立即結束）；(c) 劇本防禦者獲得 1 VP；(d) 當前時間格上的增援單位/目擊標記從友方邊緣進場（非主動玩家先放）。注意：若抽牌堆最後一張牌被翻開來擲骰且剛好骰出 Time，時間只推進 1 格而非 2 格。"}], "core_rules": [{"id": "1", "code": "1", "title_zh": "命運卡與核心卡牌規則", "title_en": "1. Fate Cards & Golden Rule", "category": "核心配件 (1–11)", "summary": "72張命運卡控制所有指令、行動、擲骰、事件與隨機格；黃金法則確立卡牌優先。", "clauses": [{"sub": "1.0 黃金法則 (Golden Rule)", "text": "當卡牌效果或劇本特殊規則與規則書條文衝突時，卡牌效果／劇本特殊規則永遠優先。基本原則：「規則字面說什麼就是什麼 (a rule means exactly what it says)」，切勿自行腦補未寫明的限制。例如：E64 陣亡 (KIA) 寫「消滅一個崩潰單位」，若場上只有己方崩潰單位，也必須選己方消滅；F104.1 地雷只攻擊「移動 (Move)」或「推進 (Advance)」的單位，因此透過 E75 潛行 (Stealth) 進出地雷格不會觸發地雷攻擊。"}, {"sub": "1.1 手牌上限 (Hand Size)", "text": "依玩家態勢 (Posture) 決定初始手牌與每回合結束補牌上限：登陸者 Invader (7張)、攻擊者 Attacker (6張)、偵察 Recon (5張)、防禦者 Defender (4張)、萬歲衝鋒 Banzai (3張)。先手卡與參考卡不計入手牌。"}, {"sub": "1.2–1.4 卡牌資訊、翻開與重洗", "text": "手牌對敵方保密；抽牌堆面朝下雙方保密；棄牌堆面朝上完全公開，雙方可隨時檢視。每當被指示「翻開 (reveal)」卡牌時，將抽牌堆頂牌翻開面朝上放到棄牌堆頂。時間推進 [13.1.2] 時，觸發者將棄牌堆與抽牌堆重洗。"}, {"sub": "1.5–1.7 指令、行動與事件", "text": "卡牌在手牌中時，只有頂端的「指令 (Order)」與照片下方的「行動 (Action)」有效，事件以下全部忽略。指令只能在己方回合打出（受指令上限限制）；行動在雙方回合滿足前提即可打出（無次數限制）；事件絕不從手牌打出，只在擲骰觸發 Event 時從牌庫頂翻開執行。"}, {"sub": "1.8 隨機格與目擊標記移動 (Random Hexes & Sighting)", "text": "1.8.1 當狙擊手或事件需要決定隨機格時，翻開抽牌堆頂牌查看左下角淺綠六角格座標（如 C2）。\n1.8.2 【CC:P 重要新增】在任何需要翻開隨機格的狙擊手或事件觸發結算完畢後，日軍玩家必須將目前在地圖上的 1 個「目擊標記 (Sighting Marker [9])」移入該隨機格。若該格已有目擊標記，則在可能的情況下必須移動另一個目擊標記進去。"}, {"sub": "1.9 擲骰與觸發器 (Die Rolls & Triggers)", "text": "需要擲骰時，翻開抽牌堆頂牌查看右下角雙骰，通常將兩骰相加（例外：瞄準擲骰 [O27.2.3] 與日軍狙擊兵 Sogeki Hei 開火攻擊擲骰 [3.3.4c] 為兩骰相乘）。\n1.9.1.1 若翻開牌庫最後一張牌產生非時間觸發，先完成時間推進 [13.1.2] 後再立刻結算該觸發。\n1.9.1.2 【觸發中不再生觸發】在結算任何觸發期間所進行的擲骰（如增援事件擲支援表、時間觸發擲驟死檢定），忽略該骰上的任何紅框觸發。\n1.9.1.3 【觸發時序】紅框觸發（Disperse / Event / Sniper / Time）必須在套用該次擲骰結果之前先完整執行完畢；但原擲骰的判定結果已經鎖定，不會因為事件（如獲得老兵標記 +1 士氣）而事後改變剛剛那次防禦檢定的成敗。"}]}, {"id": "2", "code": "2", "title_zh": "地圖、目標點與撤離點", "title_en": "2. Maps, Objectives & Exit Points", "category": "核心配件 (1–11)", "summary": "每格約30公尺，含中心白點（測LOS）、六向羅盤、砲兵框、紅圈目標點(1–5)與綠箭頭撤離點(0–3)。", "clauses": [{"sub": "2.1 戰場網格 (The Battlefield)", "text": "地圖上的六角格每格代表約 30 公尺（100 英尺）。每格包含：(a) 特定地形 [T82–T99]；(b) 用於測量視線 [16] 的中心白點；(c) 唯一座標編號（如 C7）。"}, {"sub": "2.2 地圖邊框與羅盤 (Map Border & Compass)", "text": "右上角為地圖代號字母；左下角為六向羅盤（1 朝地圖上方、4 朝下方、2 與 3 朝右側、5 與 6 朝左側），用於火砲漂移與風向事件；對角兩端設有「砲兵框 (Artillery Boxes)」放置無線電標記。"}, {"sub": "2.3 目標點 (Objectives)", "text": "每張地圖有 5 個紅底白字圓圈（1–5）。目標點預設為 0 VP，由場上抽出的目標指示物 [14.3.3] 決定其 VP 價值，歸屬於最後單獨佔領該目標的一方。"}, {"sub": "2.4 撤離點 (Exit Points)", "text": "【CC:P 新增】地圖邊緣印有數值 0–3 的淺綠色箭頭稱為撤離點。單位只能從對手地圖邊緣帶有撤離點的格子自願撤離地圖，並立即獲得該撤離點上印製的 VP（而非單位本身的傷亡分數）[14.2.2]。"}]}, {"id": "3", "code": "3", "title_zh": "單位、崩潰狀態與特殊領袖", "title_en": "3. Units, Broken State & Leaders", "category": "核心配件 (1–11)", "summary": "步兵班(4人圖)、班組(2人圖)、領袖(1人圖)；五大基礎屬性；英雄、斥候(M)與日軍狙擊兵(Sogeki Hei)。", "clauses": [{"sub": "3.1 單位五大屬性 (Unit Stats)", "text": "● 火力 (Firepower, FP)：左下第一個數字，用於白刃戰 [19] 與開火攻擊 [O27/A41]。若 FP 外圍有方框 (Boxed FP [3.1.6])，在白刃戰中額外 +1 戰力。\n● 射程 (Range)：底部中間數字，開火的最大格數距離。\n● 移動力 (Movement, MP)：右下數字，執行移動指令 [O29] 時可消耗的移動點數。\n● 士氣 (Morale)：右上角數字，防禦敵方射擊時的基礎防禦力，隨時直接加上所在格或洞穴的掩蔽值 (Cover)。\n● 指揮值 (Command)：僅領袖擁有（右側六角框內），用於範圍啟動友軍與加成同格友軍屬性。"}, {"sub": "3.2 崩潰單位 (Broken Units)", "text": "3.2.1 單位正面為正常狀態 (Unbroken)，背面頂端有紅條為崩潰狀態 (Broken)。\n3.2.2–3.2.3 單位崩潰或重整時保留所有武器、老兵、壓制標記；但【崩潰單位不能使用武器開火】。武器不會因為持有單位崩潰而跟著損壞，反之亦然。\n3.2.4 【消滅】已崩潰的單位若再次崩潰即遭「消滅 (Eliminated)」，對手獲得對應 VP [14.1]，並將該單位放上傷亡軌 [11.2]（萬歲衝鋒態勢除外 [17.2c]）。\n3.2.5 【重整 (Rally)】主要透過重整指令 [O31b]、衝鋒指令 [O25] 或事件翻回正面。"}, {"sub": "3.3.1 領袖指揮半徑與同格加成 (Command)", "text": "3.3.1.1 【指揮半徑】當具有數字指揮值的領袖作為第一個啟動單位時，可連帶啟動其指揮值格數半徑內任意數量的友方「非領袖」單位執行同一指令或機會射擊（可跨越不可通行地形或敵軍格計算距離；指揮 0 僅限同格）。\n3.3.1.2 【單位指揮加成】不論領袖是否啟動，其指揮值直接加到「同格所有友方步兵班 (Squad) 與班組 (Team)」的火力、射程、移動力與士氣上。多名領袖同格時效果累加。領袖絕不強化自己或其他領袖。\n3.3.1.3 【武器指揮加成】同格友方步兵班或班組所持有的「非重兵器 (Non-ordnance) 武器」，其火力與射程也直接加上領袖指揮值（迫擊砲等重兵器不受加成；領袖自己拿的機槍也不受加成）。"}, {"sub": "3.3.2 英雄 (Heroes)", "text": "透過英雄事件 [E61] 或蜘蛛洞事件 [E74] 登場。視同一般領袖，但有兩項例外：\n(a) 英雄撤離不拿 VP，被消滅對手也不拿 VP，離場時直接放回配件池，絕不上傷亡軌。\n(b) 【無限次啟動】作為 O20.2 的例外，英雄每回合可被啟動超過一次，因此同一回合可執行多次指令或多次機會射擊！"}, {"sub": "3.3.3 斥候 (Scouts)", "text": "【CC:P 新增】指揮值印有「M」的特殊領袖：\n(a) 獨立行動：無數字指揮值，不能強化同格友軍或武器，也不能用指揮半徑連帶啟動其他單位。\n(b) 迫擊砲觀測 (Mortar Spotting)：未崩潰的斥候可在開火指令中啟動地圖上任何位置的友方迫擊砲單位 [O27.1.3]，並由斥候所在格提供觀測視線 (LOS) [O27.2.5]。"}, {"sub": "3.3.4 日軍狙擊兵 (Sogeki Hei)", "text": "【CC:P 日軍專屬】代表樹頂或偽裝神射手，視同一般領袖但有三項例外：\n(a) 獨立行動：無指揮值（印有「-」），不能強化或啟動同格友軍。\n(b) 耐心瞄準 (Patient)：屬性帶有白底條，在所有規則中視為「重兵器 (Ordnance [5.5])」（只是他是單位而非武器），因此開火必須先做瞄準擲骰 (Targeting Roll)，且不能進行機會射擊或加入火力組。\n(c) 精準狙擊 (Sniping)：命中後的「開火攻擊擲骰 (Fire Attack Roll)」也是將兩顆骰子【相乘】而非相加！且每次射擊只影響目標格內的【單一敵方單位】（若格內有多個敵軍，由日軍指定，但只要格內有未崩潰單位就不能指定已崩潰單位）。"}, {"sub": "3.3.5 領袖攜帶武器限制", "text": "領袖只能攜帶「沒有印製紅色負數移動力修正」的武器 [5.1]。"}]}, {"id": "4", "code": "4", "title_zh": "單位狀態標記（老兵與壓制）", "title_en": "4. Unit Markers (Veteran & Suppressed)", "category": "核心配件 (1–11)", "summary": "老兵全屬性+1；壓制全屬性-1且禁開武器，僅能由重整(Revive)或萬歲衝鋒(Charge)移除。", "clauses": [{"sub": "4.1 老兵標記 (Veteran)", "text": "由 E51 百戰老兵或 E55 武士道事件放置。使該單位的 FP、射程、移動力、士氣全部 +1（指揮值不變）。老兵步兵班若拆編 (Deploy [E56])，僅其中一個替換班組繼承老兵標記。"}, {"sub": "4.2 壓制標記 (Suppressed)", "text": "由防禦檢定平手（且非移動中）[O27.3.4c]、E62 阻絕射擊或 E77 壓制射擊放置。使該單位的 FP、射程、移動力、士氣全部 -1（指揮值不變），且【被壓制的單位不能發射其持有的任何武器】（標記左上角印有 Ø Wpn 提醒）。只能透過重整指令 [O31a]、日軍衝鋒指令 [O25.1a] 或離場移除。"}]}, {"id": "5", "code": "5", "title_zh": "武器、重兵器與特殊武器", "title_en": "5. Weapons, Ordnance & Specialized Weapons", "category": "核心配件 (1–11)", "summary": "推進指令轉移武器；白條重兵器須先瞄準；火焰噴射器歸零掩蔽；迫擊砲曲射與斥候觀測。", "clauses": [{"sub": "5.1–5.3 武器效果、攜帶與轉移", "text": "每個步兵班或班組最多攜帶 1 把武器；領袖只能攜帶無負數移動修正的武器。只有「未崩潰且未被壓制」的單位可以發射其武器（可單獨射擊或加入火力組）。\n【轉移武器 [5.3]】：在 CC:P 中，武器只能在「推進 (Advance [O22.2])」指令期間轉移給同格的另一個友方單位（推進前或推進後轉移皆可，接收方不須啟動）。控制玩家也可隨時自願消滅己方武器（放入傷亡軌武器欄）。"}, {"sub": "5.4 損壞武器 (Broken Weapons)", "text": "武器損壞時翻到背面 (Broken)；已損壞武器再次損壞則消滅並放入傷亡軌武器欄。損壞武器主要透過資源否決 (Asset Denied [O23.1]) 破壞/消滅，或透過資源請求 (Asset Request [O24.6]) 修復。"}, {"sub": "5.5 重兵器 (Ordnance)", "text": "屬性後方印有「白色橫條」的武器（如迫擊砲、步兵砲、反戰車砲）以及日軍狙擊兵、俯衝轟炸機皆屬重兵器。重兵器：(1) 開火時必須先通過「瞄準擲骰 [O27.2]」（兩骰相乘 > 射程）；(2) 禁止加入火力組 [O27.3.1]；(3) 禁止執行機會射擊 [A41]；(4) 其屬性絕不受同格領袖指揮值加成 [3.3.1.3]。"}, {"sub": "5.6 特殊武器：火焰噴射器與迫擊砲", "text": "● 火焰噴射器 (Flamethrower)：攻擊時自動將目標格的掩蔽值 (Cover) 強制設為「0」，且不可被任何規則修正。\n● 迫擊砲 (Mortar)：曲射重兵器，有最小射程限制（如 2–16 代表不能打相鄰格）。若由斥候 (Scout) 啟動 [O27.1.3]，可改由該斥候所在格拉視線 (LOS) 與計算視線妨礙，但射程仍從迫擊砲自身格子起算 [O27.2.5]。攻擊叢林 [T91] 或沼澤 [T97] 時享有空爆 +2 FP 加成。"}]}, {"id": "6-11", "code": "6–11", "title_zh": "無線電、照明彈、飛機、目擊標記、先手卡與紀錄板", "title_en": "6–11. Radios, Starshells, Aircraft, Sighting, Initiative & Track Display", "category": "核心配件 (1–11)", "summary": "場外火砲、夜間照明彈(2格半徑)、空襲機、日軍目擊標記、先手卡重骰機制與傷亡/滲透軌。", "clauses": [{"sub": "6. 無線電 (Radios)", "text": "代表場外砲兵連（FP 8–12），放置於地圖角落的砲兵框內，每方同時最多 1 台。無線電不是武器。使用規則見 [O23] 與 [O24]。"}, {"sub": "7. 照明彈 (Starshells)", "text": "夜間劇本中透過資源請求 [O24.7] 放置。照亮自身所在格以及距離 2 格內的所有六角格。只要「目標格」處於被照亮狀態，就完全無視夜間視距妨礙 [18.3]（開火方所在格或中間經過格是否照亮均無關）。透過消散觸發 [1.9.2] 移除。"}, {"sub": "8. 飛機 (Aircraft)", "text": "一面為戰鬥機 (Fighter, 9 FP)，另一面為俯衝轟炸機 (Dive Bomber, 12 FP)。由空中支援事件 [E50] 放到場上，透過資源請求 [O24.4 / O24.5] 發動攻擊，攻擊完畢或被資源否決 [O23.3] / 新空中支援事件移除。"}, {"sub": "9. 目擊標記 (Sighting Markers)", "text": "日軍專屬，代表日軍潛伏的可能位置。(a) 每當任何玩家因觸發翻開隨機格時，日軍必須將地圖上 1 個目擊標記移入該隨機格 [1.8.2]；(b) 日軍執行滲透指令「現身 (Reveal [O28.2])」時，將滲透框內的單位放到目擊標記所在格，並移除 1 個目擊標記。"}, {"sub": "10. 先手卡 (Initiative Card)", "text": "10.1 【強制重骰 (Re-Roll)】持有先手卡的玩家可在任何時候、在最後一次擲骰的觸發與結果實際生效前，宣布取消該次擲骰（連同其觸發器一併取消）並要求重骰。宣布後必須立即將先手卡交給對手。對手拿到後甚至可以在同一次重骰結果出來後立刻再交還先手卡要求再重骰，無次數限制。\n10.2 【平手致勝】遊戲結束時若 VP 為 0 平手或雙方同時全滅，持有先手卡的一方直接獲勝。"}, {"sub": "11. 紀錄板 (The Track Display)", "text": "包含：(1) 勝利分數軌 (Victory Track，超過 20 VP 翻面)；(2) 傷亡軌 (Casualty Track)：僅盟軍有投降標記，盟軍陣亡單位填滿到投降標記格時盟軍立即戰敗（日軍絕不投降，但陣亡單位仍須依序放上傷亡軌並給盟軍 VP）；(3) 戰鬥序列框 (OB Display)：標示部隊素質（精銳 Elite / 正規 Line / 新兵 Green）、指令上限與態勢；(4) 日軍滲透框 (Infiltration Boxes A / B / C)；(5) 工事脆弱度與地雷火力資料框。"}]}, {"id": "12", "code": "12", "title_zh": "回合流程與棄牌上限", "title_en": "12. Sequence of Play & Discard Limits", "category": "核心機制 (12–19)", "summary": "主動玩家二選一：下達指令（最多達指令上限）或跳過棄牌（美5/英4/日3/夜2），最後補滿手牌。", "clauses": [{"sub": "12.1–12.2 指令上限與行動能力", "text": "主動玩家在其回合必須二選一：\n(a) 從手牌打出 1 張或多張指令卡（不可超過劇本規定的「指令上限 Order Limit」），逐張打出並結算完畢後再決定是否打下一張；或\n(b) 宣告不執行任何指令，改為執行跳過並棄牌 [O21]。\n在雙方回合任何時刻，只要滿足行動卡的前提條件，雙方皆可從手牌打出任意數量的行動卡。"}, {"sub": "12.3 棄牌上限 (Discard Limit)", "text": "若選擇不下達指令而跳過 (Pass)，最多可棄掉不超過陣營上限的卡牌數（可棄 0 張）：\n● 美軍 (US)：最多 5 張\n● 英聯邦 (Commonwealth)：最多 4 張\n● 日軍 (Japan)：最多 3 張\n● 夜間規則生效時 [18.1]：不論陣營一律最多 2 張。"}, {"sub": "12.4 回合結束補牌 (Hand Refill)", "text": "每個回合結束時，僅「主動玩家」從抽牌堆抽牌補滿至手牌上限 [1.1]。若抽完最後一張牌，立即暫停並執行時間推進 [13.1.2]，重洗完成後繼續把沒抽滿的手牌補齊。"}]}, {"id": "13", "code": "13", "title_zh": "遊戲時間、驟死檢定與結束條件", "title_en": "13. Game Time, Sudden Death & Game End", "category": "核心機制 (12–19)", "summary": "時間推進4步驟（洗牌→驟死檢定→防禦者+1VP→增援進場）與4種遊戲結束條件。", "clauses": [{"sub": "13.1.2 時間推進四步驟 (Time Advancement)", "text": "當擲出 Time 觸發（且未被先手卡取消）或抽牌堆抽空時，時間標記前進 1 格，並依序執行：\n(a) 【重洗牌庫】僅觸發時間推進的那位玩家，將其抽牌堆與棄牌堆洗勻組成新抽牌堆；\n(b) 【驟死檢定】若時間標記進入或超過「驟死標記 (Sudden Death)」所在格，觸發玩家擲一次骰（無觸發）：若骰數總和「小於 (<)」當前時間標記所在格的數字（注意：是比對當前時間格數字，而非驟死起始格數字！），遊戲立即結束；\n(c) 【防禦者加分】若遊戲未結束，劇本的「防禦者 (Defender)」自動獲得 1 VP；\n(d) 【增援進場】若當前時間格上有任何單位或目擊標記，所屬玩家將其作為增援放置在己方地圖邊緣的任意合法格內（非主動玩家先放；增援無線電直接放進空的砲兵框）。"}, {"sub": "13.3 遊戲結束的四種方式 (Game End)", "text": "(a) 盟軍被迫將消滅單位放到傷亡軌上「投降標記 (Surrender)」所在格 → 盟軍立即自動戰敗（不論 VP）！\n(b) 任一玩家在地圖上的最後一個單位被「消滅」，且該玩家在滲透框 (Infiltration Box) 內也沒有任何單位 → 該玩家立即自動戰敗（不論 VP）！\n(c) 任一玩家在地圖上的最後一個單位因「非消滅原因（如自願撤離）」離開地圖，且滲透框內無單位 → 進入計分結算。\n(d) 驟死檢定擲出小於當前時間格數字 → 進入計分結算。\n若因 (c) 或 (d) 結束，雙方翻開所有秘密目標指示物並結算 VP，VP 較高者獲勝（若 VP 在 0 格平手，由持有先手卡者獲勝）。"}]}, {"id": "14", "code": "14", "title_zh": "勝利條件與計分系統", "title_en": "14. Victory Conditions (Elimination, Exit & Objectives)", "category": "核心機制 (12–19)", "summary": "消滅敵軍(班2/組1/領袖1+指揮)、敵邊撤離點撤離(重回時間軌)、地圖目標點雙向分差。", "clauses": [{"sub": "14.1 消滅勝利分 (Elimination VPs)", "text": "每當敵方單位因任何原因被消滅，立即獲得 VP：\n● 步兵班 (Squad)：2 VP\n● 班組 (Team)：1 VP\n● 領袖 (Leader)：1 VP ＋ 其「未崩潰面」的指揮值 VP\n● 英雄 (Hero)：0 VP（不給分）。"}, {"sub": "14.2 撤離勝利分 (Exit VPs)", "text": "單位不得從左右兩側邊緣離開地圖。友方單位只能透過移動 [O29] 或推進 [O22]，從對手地圖邊緣帶有「撤離點 (Exit Point [2.4])」的格子花費 1 MP 自願撤離，並立即獲得該撤離點上印製的 VP（若場上有目標指示物 Y，每個撤離單位額外 +1 VP）。\n【撤離後重返戰場】：撤離的單位會自動恢復為「未崩潰」狀態（攜帶的武器也自動修復，但移除老兵與壓制標記），並由所屬玩家放到「時間軌上的任意格」（通常是下一格）作為未來的增援部隊！"}, {"sub": "14.3 目標點勝利分 (Objective VPs)", "text": "地圖上的 5 個目標點由最後單獨佔領它的玩家控制（若目標點位於多格建築物 [T85] 內，必須整棟建築所有格子都沒有敵軍才能奪取控制權）。\n公開目標指示物 (Open Objective Chits) 的分數會即時反映在 VP 軌上：當已被一方控制的公開目標易手時，記得「先扣除原控制者的 VP，再將同額 VP 加給新控制者」（例如價值 4 VP 的目標易手，會在 VP 軌上產生 8 格的移動差距！）。秘密目標指示物則在被揭露 [E69] 或遊戲結束時才計分。特殊指示物：Y（雙方自願撤離每單位 +1 VP）、Z（雙方消滅敵軍每單位 +1 VP）。"}]}, {"id": "15", "code": "15", "title_zh": "堆疊限制與超載懲罰", "title_en": "15. Stacking & Overstacking Penalty", "category": "核心機制 (12–19)", "summary": "每格最多7個人形圖示（不分敵我）；每超過1人該格掩蔽值-1！", "clauses": [{"sub": "15.1 標記堆疊限制 (Marker Stacking)", "text": "● 每個單位最多：1 個壓制標記、1 個老兵標記、1 把武器。\n● 每個砲兵框最多：1 台無線電或砲兵否決標記（先放者優先）。\n● 每個六角格最多：1 個工事標記（先放者優先，後放者無效）、1 個煙霧標記（保留最大妨礙值者）、1 個大火標記（大火格內不可有任何單位或上述標記）。"}, {"sub": "15.2 單位堆疊與超載懲罰 (Unit Stacking & Overstacking)", "text": "【CC:P 重大變更】堆疊上限以「單一六角格內所有敵我單位合計的人形圖示 (Soldier Figures)」計算（步兵班=4人、班組=2人、領袖=1人）。\n● 無懲罰上限：每格最多 7 個人形圖示（例如 1 班 + 1 組 + 1 領袖 = 4+2+1 = 7）。初始設置時嚴禁超過 7 人。\n● 超載懲罰 (Overstacking Penalty)：遊戲開始後允許超載，但格內人形圖示達到 8 個或以上時，【每超過 7 人 1 個人形圖示，該格的掩蔽值 (Cover) 就減 1】！例如：3 個美軍步兵班（共 12 個人形，超載 5 人）擠在掩蔽 +1 的棕櫚樹格，該格掩蔽會變成 1 - 5 = -4，導致每個步兵班的士氣直接暴跌 4 點！"}]}, {"id": "16", "code": "16", "title_zh": "視線 (LOS)、阻擋與妨礙", "title_en": "16. Line of Sight (LOS), Obstacles & Hindrances", "category": "核心機制 (12–19)", "summary": "兩格中心白點拉線；阻擋物隔絕視線；妨礙物不累加（取單一最大妨礙扣減火力或瞄準骰）。", "clauses": [{"sub": "16.1 視線檢查 (LOS Checks)", "text": "將一條細線拉緊連接「觀測格中心白點」與「目標格中心白點」。若細線碰到中間經過格內的地形「阻擋物 (Obstacle)」或「妨礙物 (Hindrance)」的圖形描繪，則視線受阻擋或受妨礙。觀測格與目標格本身的阻擋/妨礙地形不影響視線（唯一例外：煙霧 [16.3.4] 對射入、射出、穿過皆造成妨礙）。視線永遠雙向對稱（洞穴上下坡規則也維持對稱），且格內的敵我單位絕不會阻擋或妨礙視線。"}, {"sub": "16.2 阻擋物 (Obstacles)", "text": "地形表 LOS 欄標示「🚫」者為阻擋物（如建築物、叢林、沼澤、大火）。大火標記 [16.2.2] 視為填滿整個六角格（含六條格邊），只要視線擦過大火格邊即被完全阻擋。"}, {"sub": "16.3 妨礙物 (Hindrances)", "text": "● 對瞄準與精準度擲骰 [16.3.1]：重兵器瞄準擲骰或火砲精準度擲骰穿過妨礙時，擲骰結果扣除妨礙值；一旦命中後，後續的火砲衝擊或開火攻擊擲骰不再扣減（因為已在命中率扣除過了）。\n● 對一般開火攻擊 [16.3.2]：非重兵器開火穿過妨礙時，總火力 (FP) 扣除妨礙值。若扣減後最終 FP ≤ 0，則該次射擊無法進行（除非打出如交叉火力 Crossfire 等行動卡將最終 FP 提升至 ≥ 1）。\n● 妨礙不累加 [16.3.3]：沿線經過多個妨礙格（或夜間視距妨礙）時，【絕不累加，僅取沿線單一最大的妨礙值】套用！\n● 煙霧妨礙 [16.3.4]：煙霧填滿整個六角格（含格邊），且無論射入、射出或穿過煙霧格皆會受到妨礙。"}]}, {"id": "17", "code": "17", "title_zh": "態勢 (Posture) 規則", "title_en": "17. Posture (Attacker, Banzai, Defender, Invader, Recon)", "category": "核心機制 (12–19)", "summary": "決定手牌上限(3–7張)與陣營特殊能力（如防禦者時間加分、萬歲衝鋒死後回時間軌）。", "clauses": [{"sub": "17.1–17.5 五種態勢完整效果", "text": "● 攻擊者 (Attacker [17.1])：手牌 6 張。\n● 萬歲衝鋒 (Banzai [17.2]，日軍專屬)：手牌 3 張；可使用「衝鋒 (Charge [O25])」指令；所有被消滅的非英雄日軍單位（連同所持武器）不放進傷亡軌，而是直接放到「時間軌的下一格」作為下一波增援（盟軍仍正常獲得消滅 VP；英雄被消滅仍回配件池，其武器進傷亡軌武器欄）。日軍亦可透過 E78「天皇陛下萬歲！」事件在遊戲中途切換為此態勢。\n● 防禦者 (Defender [17.3])：手牌 4 張；可使用防禦者專屬行動 [A35, A43]；每次時間推進 [13.1.2] 獲得 1 VP。\n● 登陸者 (Invader [17.4])：手牌 7 張；通常半數以上部隊從時間軌增援登場。\n● 偵察 (Recon [17.5])：手牌 5 張。"}]}, {"id": "18", "code": "18", "title_zh": "夜間作戰規則 (Night Rules)", "title_en": "18. Night (Command, Movement, Visibility, Radios, Starshells, Aircraft)", "category": "核心機制 (12–19)", "summary": "夜間6大鐵則：棄牌限2、地形移動+1MP、視距妨礙=距離X、禁申請新無線電、可打照明彈、禁空襲。", "clauses": [{"sub": "18.1–18.6 夜間作戰六大規則", "text": "當劇本指定為「夜間 (Night)」時，整場遊戲適用以下 6 條規則：\n1. 【夜間指揮管制 (18.1)】：雙方棄牌上限統一降為 2 張。\n2. 【夜間移動 (18.2)】：地形表虛線以上的所有「地形類型 (Terrain Types，綠底標題)」移動消耗一律 +1 MP（虛線以下的道路、小徑、山丘等地形特徵不受影響）。\n3. 【夜間視距 (18.3)】：所有射擊自動產生數值為「X」的視線妨礙（X＝開火格至目標格的距離格數，至少為 1）。此妨礙與其他妨礙不累加（取最大者）；若目標格位於「照明彈 [7.2]」2 格範圍內，此夜間妨礙完全抵銷。\n4. 【夜間無線電 (18.4)】：資源請求指令中不可選擇「建立通訊 (Communication Established [O24.1])」（無法新獲得無線電；但若劇本初始配置已給予無線電，則可正常使用與修復）。\n5. 【夜間照明彈 (18.5)】：資源請求指令中可選擇「照明彈 (Illumination [O24.7])」。\n6. 【夜間無飛機 (18.6)】：空中支援事件 [E50] 在夜間完全無效。"}]}, {"id": "19", "code": "19", "title_zh": "白刃戰 (Melee)", "title_en": "19. Melee Markers & Resolution", "category": "核心機制 (12–19)", "summary": "同格放置白刃標記（禁開火/禁被射擊）；僅在「盟軍回合開始時」結算！", "clauses": [{"sub": "19.1 白刃戰標記與限制 (Melee Markers)", "text": "每當同一六角格內同時存在雙方單位時，立即放入「白刃戰 (Melee)」標記：\n● 白刃戰格內的單位與武器不能開火（其他功能如移動撤離或推進正常）。\n● 白刃戰格不能成為開火攻擊的目標，也不能將火砲觀測彈 (SR) 放置在白刃戰格或其相鄰格（但若 SR 放置在別處後因漂移進入或相鄰白刃戰格，仍會正常轟炸波及）。"}, {"sub": "19.2 白刃戰結算時機與步驟 (Resolving Melee)", "text": "【CC:P 重大規則變更】白刃戰「只在盟軍玩家回合開始時」結算（日軍回合開始時絕不結算！）。若場上有多個白刃戰格，由盟軍決定結算順序，逐格結算：\n1. 【伏擊階段 (19.2.1)】：非主動玩家（日軍）先打出所有想打的「伏擊 (Ambush [A33])」行動並結算（每張使對方 1 個參戰單位崩潰），接著主動玩家（盟軍）打出所有伏擊並結算。若一方單位因此全滅，白刃戰立即結束。\n2. 【計算白刃戰火力 (Melee FP)】：雙方加總格內各自剩餘「單位（不含武器！）」的當前火力 (FP)；每個帶有「方框火力 (Boxed FP)」的單位額外 +1。此數值在日軍擲骰前正式鎖定。\n3. 【白刃戰擲骰 (19.2.2)】：日軍先擲骰加上日軍 Melee FP 得出日軍總值；接著盟軍擲骰加上盟軍 Melee FP 得出盟軍總值（擲骰前可打「刺刀 Bayonets [A34]」+2）。\n4. 【勝負判定 (19.2.3)】：總值較低的一方格內單位全部消滅！若雙方總值「平手」，雙方單位同歸於盡——唯一例外：若其中一方在進入此次白刃戰前原本獨佔該格的「掩體 (Bunker [F101])」或「碉堡 (Pillbox [F105])」，則平手時防守該掩體/碉堡的一方全數存活，僅進攻方全滅！結算後若有單位存活，可打出「格殺勿論 (No Quarter [A46])」獲得 2 VP。"}]}], "orders": [{"id": "O20", "code": "O20", "name_zh": "指令通則", "name_en": "General Rules for Orders", "jp": "-", "cw": "-", "us": "-", "activate": "依各指令規定（每單位每回合限啟動1次，英雄除外）", "summary": "主動玩家出牌宣告指令→啟動1個未啟動友方單位（若為領袖可連帶啟動指揮半徑內非領袖友軍）→至少1個啟動單位須實際執行動作。", "details": "O20.1 打出指令卡放棄牌堆頂，啟動1個本回合尚未啟動的友方單位（若先啟動領袖，可連帶啟動其指揮半徑內任意數量未啟動的非領袖友軍）。\nO20.2 每單位每回合最多被啟動1次（英雄 [3.3.2] 例外）。\nO20.3 所有啟動單位須先指定完畢才開始執行，且至少要有1個啟動單位實際做出該指令動作（例如下達移動指令，至少要有1個啟動單位實際跨過格邊進入新格子，不能只為了打煙幕行動而空喊移動）。\nO20.4 一個指令必須完全結算完畢才能宣告下一個指令。"}, {"id": "O21", "code": "O21", "name_zh": "跳過（棄牌）", "name_en": "Pass (Discard)", "jp": "-", "cw": "-", "us": "-", "activate": "不啟動任何單位（本回合未下達任何指令時適用）", "summary": "若本回合選擇不下達任何指令，可棄掉 0 至「棄牌上限」張手牌（美5 / 英4 / 日3 / 夜間2）。", "details": "若玩家在自己回合選擇不下達任何指令，可選擇棄掉手牌中任意數量（含 0 張）不超過陣營棄牌上限的命運卡，隨後補滿手牌。注意：當你棄掉 1 張或更多牌時，對手有機會回應打出「爆破 (Demolitions [A38])」或防禦者專屬的「隱藏單位 (Hidden Unit [A43.6])」行動！"}, {"id": "O22", "code": "O22", "name_zh": "推進", "name_en": "Advance", "jp": "10", "cw": "6", "us": "5", "activate": "1 個單位（或領袖連帶指揮半徑內友軍）", "summary": "無視移動力與地形消耗移動 1 格，不會引爆機會射擊！可進敵軍格打白刃戰、可轉移武器、日軍可跨洞穴地道移動。", "details": "O22.1 啟動的單位可進入相鄰 6 格中的任一格並立即停止。推進時完全無視單位移動力數值與地形移動消耗，且【非主動玩家不能對推進中的單位使用機會射擊 (Op Fire [A41])】（但仍會觸發地雷或隱藏陷阱！）。\nO22.2 推進能力：(1) 可進入有敵軍的格子（引發白刃戰 [19]）；(2) 可從敵方地圖邊緣的撤離點撤離 [14.2.1]；(3) 日軍單位若在洞穴內，可直接「推進」至地圖上任何另一個有洞穴標記的格子（地道移動 [F102.3]）；(4) 可在推進前或推進後，將攜帶的武器轉移給同格的另一個友方單位（接收方不需啟動）。\nO22.3 限制：絕不可進入不可通行格（如大火），也不可從左右側或友方邊緣撤離。"}, {"id": "O23", "code": "O23", "name_zh": "資源否決", "name_en": "Asset Denied", "jp": "3", "cw": "3", "us": "3", "activate": "不啟動任何單位", "summary": "三選一：(a) 破壞友軍視線內1把敵方武器；(b) 破壞敵方無線電；(c) 驅離敵方場上飛機。", "details": "不啟動任何單位，主動玩家從以下三項活動中擇一執行（須滿足前提）：\n● O23.1 武器卡彈 (Weapon Jam)：前提為有敵方武器處於任一友方單位視線 (LOS) 內。選擇其中 1 把敵方武器使其損壞（翻面）；若原本已損壞則直接消滅（放入傷亡軌武器欄）。\n● O23.2 通訊中斷 (Communication Disrupted)：前提為敵方場上有無線電。使敵方無線電損壞（翻面）；若原本已損壞則直接消滅（放回配件池）。\n● O23.3 中止空襲 (Abort Run)：前提為敵方飛機標記在地圖上。將敵方飛機從地圖移除（放回配件池）。"}, {"id": "O24", "code": "O24", "name_zh": "資源請求", "name_en": "Asset Request", "jp": "6", "cw": "8", "us": "9", "activate": "依選項而定（通訊/觀測/照明須啟動1位未崩潰未壓制領袖；修武器啟動持武單位；飛機不啟動單位）", "summary": "七選一：建立通訊(買無線電)、恢復通訊(修無線電)、效力射(火砲轟炸)、俯衝轟炸(12FP)、戰鬥機掃射(9FP)、修復武器、發射照明彈(夜間)。", "details": "主動玩家從以下 7 項活動中擇一執行：\n● O24.1 建立通訊 (Communication Established)：【限砲兵框無無線電/否決標記，且非夜間】啟動 1 位未崩潰未壓制領袖，擲陣營無線電表（劇本書封底），依年份選取無線電並支付對應 VP 放入砲兵框（若選砲兵否決標記則免費放入）。\n● O24.2 恢復通訊 (Communication Restored)：【限有損壞無線電】啟動 1 位未崩潰未壓制領袖，將損壞無線電翻回正常面（因無線電本身不算啟動，若有下一張資源請求與另一位領袖可馬上呼叫砲擊）。\n● O24.3 效力射 (Fire For Effect)：【限有正常無線電】啟動 1 位未崩潰未壓制領袖作為觀測員：(a) 將觀測彈 (SR) 放入觀測員 LOS 內的任意格（不可放白刃戰格或其相鄰格）；(b) 進行精準度瞄準擲骰（兩骰相乘 > 距離，計入視線妨礙）——若命中則做「小漂移檢定」（翻頂牌看雙骰，先往白骰方向移1格、再往彩骰方向移1格，不觸發紅框）；若未命中則做「大漂移檢定」（翻頂牌，往白骰方向移動「彩骰點數」格，若飄出地圖則取消）；(c) 衝擊結算：最終落點與周圍 6 格（共 7 格轟炸區）內，每個含有單位或工事的格子分別擲一次火砲衝擊骰（若衝擊骰總值「剛好等於」工事脆弱度表數字，先摧毀該格工事再擲防禦！）。\n● O24.4 俯衝轟炸 (Bombing Run)：【限場上有己方飛機】不啟動單位，將飛機翻至「俯衝轟炸機 (12 FP)」面，視同位於 5 級山丘測 LOS，對視線內 1 個有敵軍的格子（非飛機自身格）做瞄準擲骰（兩骰相乘 > 距離），命中則進行 12 FP 開火攻擊（並檢查 12 FP 工事脆弱度表），最後移除飛機（途中若觸發 E50 空中支援事件則立即中止）。\n● O24.5 戰鬥機掃射 (Strafing Run)：【限場上有己方飛機】不啟動單位，將飛機翻至「戰鬥機 (9 FP)」面，機頭對準六向羅盤任一方向，沿正前方直線由近到遠直到地圖邊緣，對每個在視線內（視同 5 級山丘）且有「任何單位（含友軍！）」的格子各進行一次 9 FP 開火攻擊，最後移除飛機。\n● O24.6 武器修復 (Weapon Repair)：【限有損壞武器】啟動 1 個持有損壞武器的未崩潰、未壓制友方單位，將該武器翻回正常面。\n● O24.7 照明彈 (Illumination)：【限夜間規則生效】啟動 1 位未崩潰未壓制領袖，將 SR 放入其 LOS 內任意格，執行同火砲的精準度與漂移檢定，在最終落點放上「照明彈 (Starshell)」標記並移除 SR。"}, {"id": "O25", "code": "O25", "name_zh": "衝鋒", "name_en": "Charge (日軍萬歲態勢專屬)", "jp": "5", "cw": "-", "us": "-", "activate": "地圖上所有尚未啟動的日軍單位（隨後盟軍未啟動單位全體自動獲得免費機會射擊啟動！）", "summary": "【限萬歲衝鋒態勢】場上所有未啟動日軍：(a)移除壓制 → (b)若崩潰自動重整 → (c)全體啟動執行移動(Move)；盟軍所有未啟動單位可免出牌自動啟動機會射擊！", "details": "僅限日軍處於「萬歲衝鋒 (Banzai [17.2])」態勢且場上仍有未啟動日軍單位時可打出：\n● O25.1 日軍全體啟動：場上所有本回合尚未啟動的日軍單位依序：(a) 移除所有壓制標記；(b) 若處於崩潰狀態則自動重整翻回正面；(c) 全部自動啟動執行「移動 (Move [O29])」指令。\n● O25.2 盟軍自動機會射擊：在日軍實際開始移動前，盟軍玩家可自由決定讓場上任意或所有本回合尚未啟動的盟軍單位「自動啟動執行機會射擊 (Op Fire [A41])」，完全不需要從手牌打出開火行動卡！"}, {"id": "O26", "code": "O26", "name_zh": "指揮混亂", "name_en": "Command Confusion", "jp": "-", "cw": "11", "us": "12", "activate": "無法作為指令打出（廢牌指令）", "summary": "此卡不能作為指令打出（代表戰場通訊與指揮混亂），只能看下半部行動是否有用，或透過跳過(Pass)棄掉。", "details": "此卡頂端印有 Command Confusion，絕不能作為指令打出。只能利用其下半部的行動 (Action)，或在跳過回合時將其棄除（日軍牌組中沒有此指令，美軍有 12 張、英聯邦有 11 張）。"}, {"id": "O27", "code": "O27", "name_zh": "開火", "name_en": "Fire", "jp": "20", "cw": "20", "us": "20", "activate": "1 個單位（或領袖連帶指揮半徑內友軍；或斥候啟動全圖友方迫擊砲）", "summary": "對射程與視線內的非白刃戰敵軍格進行射擊。可組成相連火力組(主火力X+協同件數Y)；防禦總值 ≤ 攻擊總值一半時直接消滅！", "details": "O27.1 啟動條件：至少有 1 個啟動單位（或其武器）的射程與視線內有非白刃戰格的敵軍；或啟動 1 位斥候 (Scout) 連帶啟動場上任意位置持有迫擊砲的未崩潰未壓制友軍（此時斥候視線內須有在迫擊砲射程內的敵軍）。白刃戰格內單位不可開火。\nO27.2 重兵器瞄準 (Ordnance & Targeting)：白底條重兵器（含迫擊砲、步兵砲、日軍狙擊兵）須先測距並進行「瞄準擲骰（兩骰相乘 － 視線妨礙 > 距離）」才算命中；若宣告發射煙霧彈 [O27.2.1] 則命中後直接放隨機煙霧標記。\nO27.3 開火攻擊與火力組 (Fire Attack & Fire Groups)：\n● 火力組 [O27.3.1]：多個啟動的非重兵器單位/武器若對同一目標格內的敵軍都有無阻擋視線且在射程內，且彼此所在格子「相連成鏈 (contiguous)」，可合組火力組：總火力 ＝ 【其中 1 個主射擊件的 FP (X) ＋ 其他參戰單位/武器的總件數 (Y)】（領袖本身不參戰但提供同格指揮加成）。\n● 攻擊總值 (Attack Total) ＝ 最終 FP（加指揮、扣單一最大視線妨礙、加行動卡修正，至少須 ≥ 1）＋ 開火攻擊雙骰總和（日軍狙擊兵為兩骰相乘）。\n● 防禦總值 (Defense Total) [O27.3.4]：目標格內每個敵方單位逐一擲防禦骰（建議最後才擲領袖，以免領袖先崩潰失去指揮加成！）加上自身士氣、掩蔽值與同格領袖指揮值：\n  (a) 防禦總值 ≤ 攻擊總值的一半：該單位直接消滅（不論原本是否崩潰）！\n  (b) 防禦總值 < 攻擊總值（但超過一半）：該單位崩潰（若已崩潰則消滅）！\n  (c) 防禦總值 ＝ 攻擊總值（平手）：靜止目標受到「壓制 (Suppressed)」；但若是正在移動中的目標（遭受機會射擊）則直接「崩潰 (Break)」！\n  (d) 防禦總值 > 攻擊總值：毫髮無傷。"}, {"id": "O28", "code": "O28", "name_zh": "滲透", "name_en": "Infiltrate (日軍專屬)", "jp": "5", "cw": "-", "us": "-", "activate": "不啟動任何單位", "summary": "依卡面字母(A/B/C)檢查對應滲透框：若空則「潛伏(Hide)」花VP買部隊放進框內；若已有部隊且場上有目擊標記則「現身(Reveal)」直接空降到目擊標記格！", "details": "日軍專屬指令，不啟動單位。依卡面標示的字母（A、B 或 C，若印有 A/B/C 則任選其一）檢查紀錄板上對應的滲透框：\n● O28.1 潛伏 (Hide)：當對應滲透框為「空」時執行：(a) 在日軍支援表擲骰；(b) 選擇符合年份且配件池尚有的 1 個單位（含配發武器），支付其 VP 成本（將 VP 標記往盟軍方向推）；(c) 將該單位放入對應的滲透框 (A/B/C) 內待命。\n● O28.2 現身 (Reveal)：當對應滲透框內「已有單位」且地圖上至少有 1 個「目擊標記 (Sighting Marker [9])」時執行：(a) 選擇地圖上任一含有目擊標記的格子；(b) 將該滲透框內所有單位與武器放到該格內；(c) 移除該格的 1 個目擊標記放回配件池。"}, {"id": "O29", "code": "O29", "name_zh": "移動", "name_en": "Move", "jp": "10", "cw": "11", "us": "12", "activate": "1 個單位（或領袖連帶指揮半徑內友軍）", "summary": "依移動力(MP)逐格移動（不可進敵軍格）。每進一格須報出累計MP並短暫停頓，讓對手決定是否喊「停！」打機會射擊或隱藏陷阱。", "details": "O29.1–O29.2 啟動單位必須擁有足夠進入至少 1 個相鄰格的移動力 (MP)。進入每格須支付該地形的移動消耗（爬升山丘每升 1 級額外 +1 MP [T89.1]；夜間所有綠底地形類型 +1 MP [18.2]）。同格起算的多個啟動單位可選擇「一起移動 (Moving Together)」，但必須全程走在一起並以移動力最低者為準；否則必須一個單位完全走完才能走下一個。\nO29.4 限制：移動單位絕不可進入有敵軍的格子、不可進入不可通行格（大火），不可從左右或友方邊緣離場（可花 1 MP 從敵方邊緣撤離點撤離拿 VP）。\nO29.5 移動禮儀與機會射擊：每進入一個新六角格，主動玩家必須大聲報出目前累計消耗的 MP 並停頓片刻，讓非主動玩家決定是否喊「停 (Stop!)」以打出機會射擊 [A41] 或隱藏地雷/竹籤陷阱/鐵絲網 [A43]。"}, {"id": "O30", "code": "O30", "name_zh": "偵察", "name_en": "Reconnoiter", "jp": "5", "cw": "4", "us": "3", "activate": "1 位對至少 1 個敵方單位擁有視線 (LOS) 的未崩潰、未壓制友方領袖", "summary": "啟動1位看得見敵軍的正常領袖，偷看己方抽牌堆頂牌並三選一：(1)放回牌庫頂、(2)丟進棄牌堆、(3)直接收入手牌（突破手牌上限）！", "details": "主動玩家啟動 1 位未崩潰、未壓制，且對至少 1 個敵方單位擁有視線 (LOS) 的友方領袖。接著主動玩家偷看自己命運抽牌堆頂端的第一張牌，並三選一：\n● 將它放回抽牌堆頂端；或\n● 將它放入自己的棄牌堆；或\n● 將它直接加入自己的手牌（可使手牌暫時超過手牌上限！）。\n注意：若抽牌堆原本只剩這最後 1 張牌，選擇後兩項會使抽牌堆變空並立即觸發時間推進 [13.1.2]。任何態勢皆可使用此指令。"}, {"id": "O31", "code": "O31", "name_zh": "重整", "name_en": "Revive", "jp": "8", "cw": "9", "us": "8", "activate": "不啟動任何單位（場上須至少有 1 個崩潰或受壓制的友方單位）", "summary": "不啟動單位，依卡面數值獲得 1–5 點重整點數：每 1 點可「移除 1 個壓制標記」或「自動重整 1 個崩潰友軍（免擲骰）」！", "details": "【CC:P 取代舊版 Recover 指令】場上必須至少有 1 個已崩潰或受壓制的友方單位才可打出。不啟動任何單位。卡面印有 Revive 1 至 5，代表獲得的「重整點數 (Revive Points)」。每花費 1 點重整點數可執行以下二選一（無須擲骰，自動成功，同一單位可連續花費 2 點同時解除壓制並重整）：\n(a) 移除任一友方單位上的 1 個壓制標記 (Suppressed)；或\n(b) 使任一崩潰的友方單位重整 (Rally) 翻回正面。\n未用完的點數直接作廢。"}], "actions": [{"id": "A32", "code": "A32", "name_zh": "行動通則", "name_en": "General Rules for Actions", "jp": "-", "cw": "-", "us": "-", "prereq": "雙方回合任何時刻，滿足前提即可從手牌打出", "summary": "可連續打出多張同名行動卡且效果完全累加（如兩張刺刀+4）！除機會射擊(Op Fire)外，行動不會啟動單位。", "details": "行動在雙方回合任何時間只要符合前提即可打出，且同一時機可連續打出多張行動卡，效果全部累加（例如打出兩張 A34 刺刀會在白刃戰 +4）。除了機會射擊 [A41] 之外，行動卡不會啟動單位，且已啟動過的單位也能受到任意數量的行動卡加持。"}, {"id": "A33", "code": "A33", "name_zh": "伏擊", "name_en": "Ambush", "jp": "6", "cw": "4", "us": "3", "prereq": "白刃戰剛開始時（計算雙方 Melee FP 之前）；非主動玩家（日軍）必須先打完所有伏擊，才輪到主動玩家（盟軍）打", "summary": "對手必須選擇他參與該場白刃戰的 1 個單位使其崩潰（若已崩潰則直接消滅）！在計算白刃戰戰力前立即結算。", "details": "只能在白刃戰剛開始、尚未計算雙方白刃戰火力 (Melee FP) 前打出。非主動玩家（由於白刃戰必在盟軍回合初結算，故非主動玩家永遠是日軍）必須先決定並打出他想用的所有伏擊卡，接著才由主動玩家（盟軍）打出。每張伏擊迫使對手選 1 個參戰單位崩潰（若已崩潰則消滅），有可能在擲骰前就把一方或雙方全部消滅！"}, {"id": "A34", "code": "A34", "name_zh": "刺刀", "name_en": "Bayonets", "jp": "6", "cw": "4", "us": "3", "prereq": "該玩家即將進行白刃戰擲骰 (Melee Roll) 前一刻", "summary": "使該玩家的白刃戰擲骰總值 +2（可打多張累加）。", "details": "在該玩家進行白刃戰擲骰前打出，使該玩家的白刃戰總值 (Melee Total) +2。"}, {"id": "A35", "code": "A35", "name_zh": "歸零射擊", "name_en": "Bore Sighting (防禦者專屬)", "jp": "1", "cw": "1", "us": "1", "prereq": "【限劇本防禦者 Defender】即將進行包含「印製基礎 FP ≥ 5 的武器」參與的開火攻擊擲骰前", "summary": "該次開火攻擊的火力 (FP) +2。", "details": "僅限劇本防禦者 (Defender) 可打出。在進行包含至少一把印製基礎 FP ≥ 5（未修正前）的武器參與之開火攻擊擲骰前打出，使該次開火攻擊 FP +2。"}, {"id": "A36", "code": "A36", "name_zh": "指揮混亂", "name_en": "Command Confusion", "jp": "2", "cw": "3", "us": "4", "prereq": "無法作為行動打出（廢牌行動）", "summary": "此卡不能作為行動打出，只能使用其頂端的指令或在跳過時棄掉。", "details": "不能作為行動打出。"}, {"id": "A37", "code": "A37", "name_zh": "交叉火力", "name_en": "Crossfire", "jp": "8", "cw": "8", "us": "8", "prereq": "即將對「正在移動 (Moving [O29])」的敵方單位進行開火攻擊擲骰前（即機會射擊時）", "summary": "該次開火攻擊的火力 (FP) +2（可用於將受視線妨礙降至 0 以下的火力拉回 ≥ 1 以合法開火）。", "details": "在對正在執行移動指令 [O29] 的敵方單位進行開火攻擊擲骰前打出，使該次開火攻擊 FP +2。"}, {"id": "A38", "code": "A38", "name_zh": "爆破", "name_en": "Demolitions", "jp": "3", "cw": "3", "us": "3", "prereq": "當對手因執行「跳過 (Pass [O21])」而從手牌棄掉 1 張或更多卡牌時", "summary": "消除任一「含有友方單位」的格子內的工事標記 (Fortification)。", "details": "當對手宣告跳過 (Pass) 並實際棄掉至少 1 張手牌時可打出（若對手跳過但棄 0 張牌則不可打出）：選擇任一含有友方單位的六角格，直接消除該格內的工事標記。"}, {"id": "A39", "code": "A39", "name_zh": "縱射", "name_en": "Enfilade", "jp": "6", "cw": "6", "us": "6", "prereq": "當 2 個或更多啟動的單位/武器組成「火力組 (Fire Group [O27.3.1])」即將進行開火攻擊擲骰前", "summary": "火力組中「除第一個以外的每個參戰單位/武器」額外提供 +1 FP（與火力組原本的 +1 累加，等於每多一件協同件 +2 FP）！", "details": "【CC:P 新增強力行動】在火力組進行開火攻擊擲骰前打出：火力組中除了主射擊件 (X) 以外的每一個協同射擊件 (Y)，都讓該次開火攻擊額外 +1 FP（與火力組原本的 Y 加成累加）。"}, {"id": "A40", "code": "A40", "name_zh": "炸藥包", "name_en": "Explosive Charge", "jp": "1", "cw": "2", "us": "3", "prereq": "對「相鄰格」且含有工事的目標進行開火攻擊擲骰，且骰出「雙胞胎（兩顆骰子點數相同 Doubles）」時", "summary": "在目標進行防禦擲骰「之前」，立即摧毀並移除該相鄰目標格內的工事標記（目標隨即失去該工事掩蔽）！", "details": "代表近距離投擲炸藥包或巴祖卡火箭筒。當對相鄰格進行開火攻擊擲骰且骰出雙骰同點 (Doubles)，而該目標格內含有工事時打出：在敵軍進行防禦擲骰之前，立即消除該格內的工事標記！"}, {"id": "A41", "code": "A41", "name_zh": "機會射擊", "name_en": "(Opportunity) Fire", "jp": "20", "cw": "20", "us": "20", "prereq": "對手執行移動指令 (Move [O29]) 期間，移動單位剛跨入一個新六角格並報出 MP 時（印於卡面頂端 ORDER/ACTION FIRE）", "summary": "喊「停！」並打出開火卡啟動友軍對剛進入新格的敵軍射擊。一旦啟動，在該次移動指令期間可對後續每格移動重複開火！", "details": "A41.1–A41.2 當對手移動單位每進入一個新格子並消耗 MP 時，非主動玩家可喊「Wait!（停！）」暫停移動，並可執行以下一項或兩項：(1) 從手牌打出一張 `ORDER/ACTION FIRE` 卡，啟動 1 個單位（或領袖連帶指揮半徑內友軍）對該格開火；及／或 (2) 使用在「同一次移動指令期間」稍早已經啟動過機會射擊的單位/武器，對該格進行一次開火攻擊。\nA41.3 三大重要例外：\n(a) 重兵器 (Ordnance，含迫擊砲、日軍狙擊兵) 絕不能進行機會射擊（但持有重兵器的步兵班/組本身可用自身步槍數值正常機會射擊）。\n(b) 【持續射擊資格】為機會射擊而啟動的單位/武器，在「同一個移動指令期間」不限只開火一次！對手每走進一個新格子（消耗一次 MP），這些已啟動的機會射擊單位都可以再次對其開火（不需再打新的開火卡）！但當對手結束該張移動指令後，若對手再打第二張移動指令，這些單位因本回合已被啟動過，就不能再被啟動了。\n(c) 對手每消耗一次 MP（進入一格），非主動玩家最多只能發動「一次」開火攻擊（可合組火力組）。注意：移動單位若在防禦檢定與攻擊總值平手，會直接「崩潰」而非壓制！"}, {"id": "A42", "code": "A42", "name_zh": "手榴彈", "name_en": "Hand Grenades", "jp": "9", "cw": "9", "us": "9", "prereq": "即將進行開火攻擊擲骰前，且至少有 1 個參戰單位/武器是對「相鄰格」開火", "summary": "該次開火攻擊的火力 (FP) +2。", "details": "在開火攻擊擲骰前打出，前提是至少有 1 個射擊單位/武器與目標格相鄰（若是火力組，只需其中一個開火格與目標格相鄰即可）。使該次開火攻擊 FP +2。"}, {"id": "A43.1", "code": "A43.1", "name_zh": "隱藏洞穴", "name_en": "Hidden Cave (日軍防禦者專屬)", "jp": "1", "cw": "-", "us": "-", "prereq": "【限日軍劇本防禦者】即將進行防禦擲骰前，且受攻擊格為「山丘稜線格 (Crest Hex [T89.3.1])」、非水域且尚無任何工事", "summary": "立即在該受攻擊格放置 1 個「洞穴 (Cave [F102])」標記（日軍單位可立即選擇進入洞穴內）！", "details": "僅限日軍擔任劇本防禦者 (Defender) 時使用。在進行防禦擲骰前，若受攻擊格為山丘稜線格 (Crest Hex)、非水域且無其他工事，可在該格放置 1 個洞穴標記 [F102]，且格內日軍可依 [F102.1.1] 立即進入洞穴內部（可能因此對上坡敵軍視線免疫或獲得洞穴 4/8 掩蔽）！"}, {"id": "A43.2", "code": "A43.2", "name_zh": "隱藏地雷", "name_en": "Hidden Mines (盟軍防禦者專屬)", "jp": "-", "cw": "1", "us": "1", "prereq": "【限劇本防禦者】在 1 個或多個敵方單位「移動 (Move)」或「推進 (Advance)」進入一個非水域、無工事的格子後立即打出", "summary": "在該格放置「地雷 (Mines [F104])」標記，並立即對剛進入該格的移動/推進單位發動一次地雷攻擊（預設 6 FP，0 掩蔽）！", "details": "防禦者專屬。當敵軍移動或推進進入一個非水域且無工事的格子時打出：放入地雷標記 [F104]，並立即對那些剛進入的單位進行一次地雷攻擊（原本就在格內的單位不受此次初始地雷攻擊影響）。"}, {"id": "A43.3", "code": "A43.3", "name_zh": "隱藏竹籤陷阱", "name_en": "Hidden Panji Trap (日軍防禦者專屬)", "jp": "3", "cw": "-", "us": "-", "prereq": "【限日軍劇本防禦者】在 1 個或多個敵方單位移動或推進進入一個非水域、無工事的格子後立即打出", "summary": "二選一：(1) 在該格放置「地雷 (Mines)」並立即進行地雷攻擊；或 (2) 在該格放置「鐵絲網 (Wire [F107])」（強制結束移動）！", "details": "日軍防禦者專屬。當敵軍移動或推進進入一個非水域且無工事的格子時，日軍二選一：(1) 放置地雷標記並立即發動地雷攻擊 [F104.2]；或 (2) 放置鐵絲網標記 [F107]（由於進入鐵絲網後會失去所有剩餘 MP，敵軍的移動將被迫立即停在該格！）。"}, {"id": "A43.4", "code": "A43.4", "name_zh": "隱藏碉堡", "name_en": "Hidden Pillbox (防禦者專屬)", "jp": "2", "cw": "1", "us": "1", "prereq": "【限劇本防禦者】即將進行防禦擲骰前，且受攻擊格非水域、尚無任何工事", "summary": "在該受攻擊格放置 1 個「碉堡 (Pillbox [F105])」標記（提供 5 掩蔽，對曲射/空襲 6 掩蔽）。", "details": "防禦者專屬。在進行防禦擲骰前，於受攻擊的非水域、無工事格子內放置 1 個碉堡標記 [F105]。"}, {"id": "A43.5", "code": "A43.5", "name_zh": "隱藏戰壕", "name_en": "Hidden Trenchline (防禦者專屬)", "jp": "2", "cw": "2", "us": "2", "prereq": "【限劇本防禦者】即將進行防禦擲骰前，且受攻擊格非水域、尚無任何工事", "summary": "在該受攻擊格放置 1 個「戰壕 (Trench [F106])」標記（提供 4 掩蔽，對曲射/空襲 5 掩蔽）。", "details": "防禦者專屬。在進行防禦擲骰前，於受攻擊的非水域、無工事格子內放置 1 個戰壕標記 [F106]。"}, {"id": "A43.6", "code": "A43.6", "name_zh": "隱藏單位", "name_en": "Hidden Unit (防禦者專屬)", "jp": "1", "cw": "1", "us": "1", "prereq": "【限劇本防禦者】當對手因「跳過 (Pass [O21])」從手牌棄掉 1 張或更多卡牌時", "summary": "擲己方支援表，免費選取 1 個符合年份的單位（含武器），直接部署在己方初始部署區內「無單位且掩蔽 ≥ 1」的任意格！", "details": "防禦者專屬。當對手跳過並棄掉至少 1 張牌時：(a) 擲己方陣營支援表；(b) 免費選取對應欄位中符合劇本年份的 1 個單位（連同配發武器）；(c) 將該單位放置在「己方原始設置區域內」、「無任何敵我單位」且「掩蔽值至少為 1」的格子內。"}, {"id": "A43.7", "code": "A43.7", "name_zh": "隱藏鐵絲網", "name_en": "Hidden Wire (盟軍防禦者專屬)", "jp": "-", "cw": "2", "us": "2", "prereq": "【限劇本防禦者】在 1 個或多個敵方單位移動或推進進入一個非水域、無工事的格子後立即打出", "summary": "在該格放置「鐵絲網 (Wire [F107])」標記（進入的移動單位立即失去所有剩餘 MP 並停止移動，且屬性 -1）。", "details": "防禦者專屬。當敵軍移動或推進進入非水域、無工事格時，放入鐵絲網標記 [F107]。若敵軍是在執行移動 (Move)，會因進入鐵絲網而立即失去所有剩餘 MP 被迫停下（且尚未給對手開火機會前先扣 FP/射程/士氣各 1 點！）。"}, {"id": "A44", "code": "A44", "name_zh": "輕傷", "name_en": "Light Wounds", "jp": "12", "cw": "6", "us": "6", "prereq": "當己方 1 個「步兵班 (Squad)」（不論正常或已崩潰）即將發生「崩潰 (Break)」的瞬間（不適用於被直接消滅的情況！）", "summary": "失去 1 VP，代替該步兵班崩潰（或因二次崩潰而消滅）：將該步兵班移回配件池，換成 1 個同狀態、符合己方 OB 素質的「班組 (Team)」留在原地！", "details": "只能在友方「步兵班 (Squad)」即將崩潰（包含已崩潰步兵班再次崩潰即將消滅）的瞬間打出；若該步兵班是遭受「直接消滅 (outright elimination)」（例如防禦總值 ≤ 攻擊總值一半、KIA 事件、白刃戰戰敗），則【不能】打出輕傷！\n效果：主動失去 1 VP，將該步兵班放回配件池，從配件池拿取 1 個符合己方 OB 素質標記（精銳/正規/新兵）的「班組 (Team)」放入原格。若原步兵班是正常狀態，新班組就是正常狀態；若原步兵班已崩潰，新班組進場也是崩潰狀態（但逃過死劫！）。原步兵班的武器、老兵、壓制標記與本回合啟動狀態皆由該班組繼承。"}, {"id": "A45", "code": "A45", "name_zh": "神準槍法", "name_en": "Marksmanship", "jp": "-", "cw": "6", "us": "3", "prereq": "即將進行開火攻擊擲骰前，且參戰單位中包含至少 1 個該國籍的「步兵班 (Squad)」或「班組 (Team)」", "summary": "該次開火攻擊的火力 (FP) +2。", "details": "在開火攻擊擲骰前打出（必須有步兵班或班組參與射擊，不能只有領袖或純武器射擊），使該次開火攻擊 FP +2。"}, {"id": "A46", "code": "A46", "name_zh": "格殺勿論", "name_en": "No Quarter", "jp": "3", "cw": "-", "us": "1", "prereq": "在一場白刃戰 (Melee) 結算結束時，且打出此卡的玩家在該場白刃戰中至少有 1 個單位存活", "summary": "打出此卡的玩家立即獲得 2 VP。", "details": "在白刃戰結算完畢且己方至少有 1 個單位在該白刃戰格存活時打出，立即獲得 2 VP。"}, {"id": "A47", "code": "A47", "name_zh": "煙幕掩護", "name_en": "Smoke Screen", "jp": "-", "cw": "4", "us": "6", "prereq": "在「移動 (Move)」或「推進 (Advance)」指令剛開始時（任何啟動單位實際跨步移動前），且至少啟動了 1 個「步兵班 (Squad)」", "summary": "每個被啟動的友方步兵班，都可以在「自身格或相鄰非水域、非大火格」隨機抽取並放置 1 個煙霧標記！", "details": "【CC:P 新增行動】在移動或推進指令剛宣告、啟動完單位但尚未實際跨出第一步前打出：依序為每個被啟動的步兵班 (Squad)，選擇其所在格或相鄰格（不可為水域或大火格），從抽袋隨機抽 1 個煙霧標記放入（也可中途決定停止抽取）。若有 3 個步兵班被啟動，一張煙幕掩護就能放最多 3 個煙霧！若同格已有煙霧，僅保留妨礙值較大者。"}, {"id": "A48", "code": "A48", "name_zh": "持續射擊", "name_en": "Sustained Fire", "jp": "6", "cw": "9", "us": "9", "prereq": "即將進行開火攻擊擲骰前，且至少有 1 把「迫擊砲 (Mortar)」或「機槍 (MG)」參與此次射擊", "summary": "該次開火攻擊 FP +2；但若開火攻擊擲骰骰出「雙胞胎（兩骰同點 Doubles）」，其中 1 把參戰的機槍或迫擊砲必須損壞（翻面）！", "details": "在至少有 1 把機槍或迫擊砲參戰的開火攻擊擲骰前打出：攻擊 FP +2，但若開火攻擊骰出雙骰同點 (Doubles)，開火玩家必須選擇 1 把參戰的機槍或迫擊砲使其損壞。注意：若對同一次射擊連續打出兩張持續射擊並骰出同點，副作用也會累加，可能導致同一把武器損壞後立刻再次損壞而直接消滅！"}], "events": [{"id": "E49", "code": "E49", "name_zh": "事件通則", "name_en": "General Rules for Events", "summary": "僅由紅框 Event 觸發翻開執行：(a) 無法執行的部分忽略，盡可能執行可行部分；(b) 多項活動依卡面順序執行；(c) 事件期間擲骰忽略所有紅框觸發。"}, {"id": "E50", "code": "E50", "name_zh": "空中支援", "name_en": "Air Support", "summary": "若劇本年份不在卡面年份範圍內或處於夜間則無效。若對手飛機在場上，直接將對手飛機移除；若對手無飛機在場，抽 1 個隨機格（如 D4），將己方飛機放到同一字母列（D列任一格）或同一數字行（4行任一格）！"}, {"id": "E51", "code": "E51", "name_zh": "百戰老兵", "name_en": "Battle Harden", "summary": "選擇場上 1 個尚無老兵標記的友方單位，放上 1 個「老兵 (Veteran [4.1])」標記（全屬性 +1）。"}, {"id": "E52", "code": "E52", "name_zh": "嗜戰狂熱", "name_en": "Battlelust", "summary": "若目前傷亡軌 (Casualty Track) 上的「敵方單位數量」多於「友方單位數量」，觸發玩家獲得 1 VP。"}, {"id": "E53", "code": "E53", "name_zh": "大火", "name_en": "Blaze", "summary": "抽 1 個隨機格 [1.8]。若該格非水域且尚無大火，放入「大火 (Blaze [T83])」標記，移除該格任何煙霧或工事，格內所有單位必須由所屬玩家移入相鄰非大火格（非主動玩家先移；若無處可退則消滅）。"}, {"id": "E54", "code": "E54", "name_zh": "微風", "name_en": "Breezy", "summary": "依卡面順風方向（1–6 對應羅盤）：(a) 場上所有煙霧往順風方向飄移 1 格（飄出地圖或進水域/大火則移除）；(b) 每個現有大火格順風方向相鄰的非水域格都放上新大火標記；(c) 被大火蔓延的格子移除工事，單位退入相鄰非大火格（非主動玩家先移）。"}, {"id": "E55", "code": "E55", "name_zh": "武士道", "name_en": "Bushido (日軍事件)", "summary": "日軍玩家重整 (Rally) 場上 1 個崩潰的日軍單位；若成功重整，且該單位尚無老兵標記，則同時在該單位放上 1 個「老兵 (Veteran)」標記！"}, {"id": "E56", "code": "E56", "name_zh": "拆編部署", "name_en": "Deploy", "summary": "可選擇場上 1 個友方「步兵班 (Squad)」移回配件池，換成 2 個符合己方 OB 素質的「班組 (Team)」放入原格（承接原崩潰與本回合啟動狀態；武器、老兵、壓制標記僅由其中 1 個班組保留，多標記可分攤）。"}, {"id": "E57", "code": "E57", "name_zh": "戰場殘骸", "name_en": "Detritus of War", "summary": "依序抽 3 個隨機格（記得每次隨機格結算後都要移動日軍目擊標記！）：(a) 第一格放隨機煙霧（非水域/大火）；(b) 第二格放鐵絲網 [F107]（非水域/大火/工事）；(c) 第三格放地雷 [F104]（非水域/大火/工事，已在格內單位要等移動離開才被炸）。"}, {"id": "E58", "code": "E58", "name_zh": "戰場主宰", "name_en": "Field of Battle", "summary": "若觸發玩家目前控制的地圖目標點 (Objectives) 數量多於對手，獲得 1 VP。"}, {"id": "E59", "code": "E59", "name_zh": "戰地拔擢", "name_en": "Field Promotion", "summary": "若己方的「二等兵領袖 (Private，6 士氣 / 2 指揮)」尚未在場上，可將其放置到任一含有「己方崩潰單位」的格子內。"}, {"id": "E60", "code": "E60", "name_zh": "陣風", "name_en": "Gusts", "summary": "依卡面指示，移除場上所有「奇數妨礙值」或所有「偶數妨礙值」的煙霧標記（放回抽袋）。"}, {"id": "E61", "code": "E61", "name_zh": "英雄登場", "name_en": "Hero", "summary": "若己方的「英雄 (Hero [3.3.2])」單位尚未在場上，可將其放入任一友方格內；若如此做，可同時重整 (Rally) 該格內的 1 個崩潰友方單位。"}, {"id": "E62", "code": "E62", "name_zh": "阻絕射擊", "name_en": "Interdiction", "summary": "必須選擇場上 1 個位於「掩蔽值 < 1（即 0 或負數）」格子內且尚未被壓制的單位（敵我皆可、崩潰與否皆可），放上 1 個「壓制 (Suppressed)」標記。"}, {"id": "E63", "code": "E63", "name_zh": "卡彈（日軍武器）", "name_en": "Jam", "summary": "抽 1 個隨機格 [1.8]，使距離該格最近的 1 把「日軍武器」損壞（若已損壞則直接消滅！距離平手由抽牌者選擇）。"}, {"id": "E64", "code": "E64", "name_zh": "陣亡", "name_en": "KIA", "summary": "必須選擇場上 1 個「已崩潰單位（敵我皆可）」並將其直接消滅！（注意：若場上只有你自己的崩潰單位，你也必須選自己的消滅！）"}, {"id": "E65", "code": "E65", "name_zh": "武器故障", "name_en": "Malfunction", "summary": "抽 1 個隨機格 [1.8]，使距離該格最近的 1 把「未損壞武器（敵我皆可）」損壞（翻面）。"}, {"id": "E66", "code": "E66", "name_zh": "醫護兵！", "name_en": "Medic!", "summary": "必須選擇場上 1 個「已崩潰單位（敵我皆可）」並使其重整 (Rally) 翻回正面。"}, {"id": "E67", "code": "E67", "name_zh": "任務目標", "name_en": "Mission Objective", "summary": "隨機抽取 1 個「秘密目標指示物 (Secret Objective Chit)」放入己方目標欄（與現有目標累加計分；若抽到無秘密面的指示物則必須公開放置）。"}, {"id": "E68", "code": "E68", "name_zh": "戰俘", "name_en": "Prisoners of War", "summary": "觸發玩家必須選擇 1 個「與敵方單位同格或相鄰」的「己方已崩潰單位」並將其直接消滅！"}, {"id": "E69", "code": "E69", "name_zh": "敵情偵察", "name_en": "Reconnaissance", "summary": "對手必須選擇並翻開他的 1 個尚未公開的「秘密目標指示物」，該指示物在剩餘遊戲中變為公開目標（立即將對應目標點的 VP 加給當前控制者！）。"}, {"id": "E70", "code": "E70", "name_zh": "增援部隊", "name_en": "Reinforcements", "summary": "擲己方陣營支援表，免費選取對應欄位中符合劇本年份的 1 個單位（含武器）或目擊標記，放置於己方地圖邊緣的任意非不可通行格內。"}, {"id": "E71", "code": "E71", "name_zh": "戰場搜刮", "name_en": "Scrounge", "summary": "可從傷亡軌武器欄選取 1 把已消滅的武器（敵我皆可），以「已損壞 (Broken)」面朝上的狀態交給場上 1 個目前沒有武器的友方單位持有。"}, {"id": "E72", "code": "E72", "name_zh": "砲彈休克", "name_en": "Shell Shock", "summary": "抽 1 個隨機格 [1.8]，使距離該格最近的 1 個單位（敵我皆可）崩潰（若已崩潰則消滅！距離平手由抽牌者選擇）。"}, {"id": "E73", "code": "E73", "name_zh": "彈坑", "name_en": "Shellholes", "summary": "抽 1 個隨機格 [1.8]。若該格非水域且尚無大火或任何工事，在該格放入 1 個「散兵坑 (Foxholes [F103])」標記（提供 3/4 掩蔽）。"}, {"id": "E74", "code": "E74", "name_zh": "蜘蛛洞", "name_en": "Spider Hole (日軍英雄)", "summary": "將「日軍英雄 (Japanese Hero)」從任何位置（場上、紀錄板或配件池，保留其攜帶武器或老兵標記）拿起，抽 1 個隨機格 [1.8]，將日軍英雄以「未崩潰且未壓制」狀態放到該隨機格或相鄰的非不可通行格內！"}, {"id": "E75", "code": "E75", "name_zh": "潛行（勘誤：原印 Low Crawl）", "name_en": "Stealth (Errata: printed as Low Crawl on A-3, C-31, C-32)", "summary": "【含官方 FAQ 勘誤】可選擇場上 1 個己方單位（日軍亦可選目擊標記），將其從當前格拿起並放入相鄰的非不可通行格內（不視為移動或推進，不會觸發機會射擊或地雷！）。"}, {"id": "E76", "code": "E76", "name_zh": "戰略目標", "name_en": "Strategic Objective", "summary": "隨機抽取 1 個目標指示物，以「公開 (Open)」面朝上放入目標框中央（立即將對應目標點的 VP 加給當前控制者）。"}, {"id": "E77", "code": "E77", "name_zh": "壓制射擊", "name_en": "Suppressing Fire", "summary": "可在處於己方 1 把「正常運作機槍 (MG)」（機槍未損壞，且持有單位未崩潰、未壓制）射程與視線內的 1 個未受壓制敵方單位上，放置 1 個「壓制 (Suppressed)」標記。"}, {"id": "E78", "code": "E78", "name_zh": "天皇陛下萬歲！", "name_en": "Tennōheika Banzai! (日軍態勢轉換)", "summary": "檢查當前 VP 標記位置：(a) 若 VP 在盟軍側（日軍落後），日軍【必須】將態勢改為「萬歲衝鋒 (Banzai [17.2])」；(b) 若 VP 在 0 或日軍側，日軍【可以選擇】是否改為萬歲衝鋒。若切換為萬歲衝鋒：換上 Banzai OB 標記，且若日軍手牌 ≥ 4 張，須立刻自選棄牌至剩 3 張！"}, {"id": "E79", "code": "E79", "name_zh": "輕傷歸隊", "name_en": "Walking Wounded", "summary": "從傷亡軌選取 1 個已消滅單位（敵我皆可），抽 1 個隨機格 [1.8]，將該單位以「已崩潰 (Broken)」狀態放入該隨機格或相鄰的非不可通行格內（注意：不退還當時消滅所得的 VP）。"}, {"id": "E80", "code": "E80", "name_zh": "白磷彈", "name_en": "White Phosphorus", "summary": "可抽 1 個隨機煙霧標記，放入與己方 1 個「未崩潰步兵班 (Squad)」相鄰的非水域、非大火格內。若如此做，在該格內擁有單位的每位玩家，都必須各自選擇該格內 1 個自己的單位使其崩潰！"}], "terrain": [{"id": "T81", "code": "T81", "type": "通則", "priority": 0, "name_zh": "地形通則與優先序", "name_en": "General Terrain Rules", "mp": "-", "mp_night": "-", "cover": "不累加(擇優) / 超載每多1人-1", "los": "阻擋 / 妨礙 / 清晰", "special": "地形表由上往下具「階層優先序 (hierarchical order)」：當一格同時有多種綠底「地形類型 (Terrain Types)」時，以地形表最靠上方的地形定義該格（例如橋樑＋溪流＝橋樑格，而非水域格！）。棕底為「地形特徵 (Terrain Features，如山丘、道路、小徑、煙霧)」，用於修正所在格的地形類型。掩蔽值絕不累加（由單位擁有者擇一使用），且格內超過 7 個人形圖示時，每多 1 人掩蔽值 -1 [T81.3.2]。"}, {"id": "T83", "code": "T83", "type": "標記/阻擋", "priority": 1, "name_zh": "大火", "name_en": "Blaze", "mp": "不可通行", "mp_night": "不可通行", "cover": "不可通行", "los": "🚫 阻擋 (所有高度)", "special": "視為填滿整格（含六條格邊），在任何山丘高度下皆完全阻擋穿過該格或擦過格邊的視線。格內不可有任何單位、煙霧或工事。"}, {"id": "T85", "code": "T85", "type": "地形類型 (綠底)", "priority": 2, "name_zh": "建築物", "name_en": "Building", "mp": "2", "mp_night": "3", "cover": "+3", "los": "🚫 阻擋 (產生1格盲區)", "special": "跨越 2 格或以上的人造結構（若僅在單一格內未跨過格邊則為 T90 茅屋）。對高處觀測者會在後方產生 1 格盲區 [T89.4.1]。若地圖目標點位於建築物格，必須「整棟建築所有格子」皆無敵軍才能奪取控制權。"}, {"id": "T84", "code": "T84", "type": "地形類型 (綠底)", "priority": 3, "name_zh": "橋樑", "name_en": "Bridge", "mp": "1 (沿橋面/道路/小徑格邊進入)；否則依格內其他地形", "mp_night": "2 (或依其他地形+1)", "cover": "+1", "los": "清晰 (Clear)", "special": "優先序高於溪流與水障，因此橋樑格「不算水域地形」（可在橋上開火、放煙霧或工事）。"}, {"id": "T90", "code": "T90", "type": "地形類型 (綠底)", "priority": 4, "name_zh": "茅屋", "name_en": "Hut", "mp": "2", "mp_night": "3", "cover": "+2", "los": "4 妨礙 (Hindrance)", "special": "僅佔據單一六角格、未跨過格邊的人造結構（注意：茅屋是 4 點視線妨礙，而非阻擋物！）。"}, {"id": "T91", "code": "T91", "type": "地形類型 (綠底)", "priority": 5, "name_zh": "叢林", "name_en": "Jungle", "mp": "3", "mp_night": "4", "cover": "+2", "los": "🚫 阻擋 (產生1格盲區)", "special": "【空爆 Airbursts】：任何「迫擊砲 (Mortar)」或「火砲 (Artillery)」對叢林格進行的開火攻擊，其攻擊總值 (Attack Total) 永遠 +2（即使格內單位改用洞穴或碉堡的掩蔽值，此 +2 依然生效）！"}, {"id": "T93", "code": "T93", "type": "地形類型 (綠底)", "priority": 6, "name_zh": "棕櫚樹林", "name_en": "Palm", "mp": "1", "mp_night": "2", "cover": "+1", "los": "1 妨礙 (Hindrance)", "special": "輕度掩蔽與 1 點視線妨礙，移動僅需 1 MP。"}, {"id": "T86", "code": "T86", "type": "地形類型 (綠底)", "priority": 7, "name_zh": "灌木叢", "name_en": "Bush", "mp": "2", "mp_night": "3", "cover": "+2", "los": "2 妨礙 (Hindrance)", "special": "代表灌木、珊瑚礁岩、碎石坡或稀疏林地。"}, {"id": "T87", "code": "T87", "type": "地形類型 (綠底)", "priority": 8, "name_zh": "高草叢", "name_en": "Grass", "mp": "2", "mp_night": "3", "cover": "0", "los": "3 妨礙 (Hindrance)", "special": "代表茅草、象草或芒草：不提供掩蔽 (Cover 0)，但造成高達 3 點的視線妨礙！"}, {"id": "T97", "code": "T97", "type": "地形類型 (綠底/水域)", "priority": 9, "name_zh": "沼澤", "name_en": "Swamp", "mp": "4", "mp_night": "5", "cover": "+2", "los": "🚫 阻擋 (產生1格盲區)", "special": "● 【水域地形】：沼澤格內禁止使用任何武器開火，且絕不可放置大火、煙霧或任何工事。\n● 【空爆 Airbursts】：迫擊砲或火砲攻擊沼澤格時，攻擊總值永遠 +2！"}, {"id": "T88", "code": "T88", "type": "地形類型 (綠底)", "priority": 10, "name_zh": "乾溝 / 窪地", "name_en": "Gully", "mp": "2", "mp_night": "3", "cover": "+1", "los": "清晰 (具低窪視線限制)", "special": "【低窪地 Depression】：位於乾溝內的單位，只有「相鄰格」或「位於較高高度（山丘 [T89]）」的單位才看得見它（     function linkifyRefs(text) {
      if (!text) return '';
      const escaped = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br/>');
      return escaped.replace(/\[([OAETF]?\d+(?:\.\d+)*[a-z]?)\]/g, (match, code) => {
        const targetId = resolveTargetRuleId(code);
        return `<button type="button" data-ref-jump="${targetId}" class="inline-ref-btn px-1.5 py-0.5 mx-0.5 rounded bg-amber-500/20 hover:bg-amber-500/40 text-amber-300 border border-amber-500/40 font-mono text-xs transition">[${code}]</button>`;
      });
    }

    function resolveTargetRuleId(rawCode) {
      if (!rawCode) return 'rule-1';
      const clean = rawCode.trim();
      if (/^A43\.[1-7]$/.test(clean)) return 'rule-' + clean;
      const prefixMatch = clean.match(/^([OAETF]\d+)/);
      if (prefixMatch) return 'rule-' + prefixMatch[1];
      const numMatch = clean.match(/^(\d+)/);
      if (numMatch) {
        const n = parseInt(numMatch[1], 10);
        if (n >= 6 && n <= 11) return 'rule-6-11';
        return 'rule-' + n;
      }
      return 'rule-' + clean;
    }

    function jumpToRuleId(targetId) {
      const el = document.getElementById(targetId) || document.getElementById('rule-' + targetId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.remove('rule-highlight');
        void el.offsetWidth;
        el.classList.add('rule-highlight');
      }
    }

    function renderFullRulebook(query = '') {
      const q = query.trim().toLowerCase();
      document.getElementById('goldenRuleText').innerHTML = linkifyRefs(CCP_DATA.meta.golden_rule);

      let totalMatches = 0;

      // 1. Core Rules
      const coreSec = document.getElementById('sec-core');
      const filteredCore = CCP_DATA.core_rules.filter(r => {
        if (!q) return true;
        const blob = (r.code + ' ' + r.title_zh + ' ' + r.title_en + ' ' + r.summary + ' ' + r.clauses.map(c => c.sub + ' ' + c.text).join(' ')).toLowerCase();
        return blob.includes(q);
      });
      totalMatches += filteredCore.length;
      coreSec.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <h2 class="text-lg font-bold text-amber-400">一、核心規則：配件與遊戲機制 (Core Rules 1–19)</h2>
          <span class="text-xs text-slate-400">${filteredCore.length} 節</span>
        </div>

    function buildSidebarIndex() {
      const groups = [
        { title: '核心規則 (1–19)', items: CCP_DATA.core_rules.map(r => ({ id: 'rule-' + r.id, label: r.code + ' ' + r.title_zh })) },

        { title: '行動 (A32–A48)', items: CCP_DATA.actions.map(a => ({ id: 'rule-' + a.id, label: a.code + ' ' + a.name_zh })) },
        { title: '地形 (T81–T99)', items: CCP_DATA.terrain.map(t => ({ id: 'rule-' + t.id, label: t.code + ' ' + t.name_zh })) },
        { title: '工事 (F100–F107)', items: CCP_DATA.fortifications.map(f => ({ id: 'rule-' + f.id, label: f.code + ' ' + f.name_zh })) },
        { title: '事件 (E49–E80)', items: CCP_DATA.events.map(e => ({ id: 'rule-' + e.id, label: e.code + ' ' + e.name_zh })) }
      ];
      const container = document.getElementById('sidebarIndexContainer');
      container.innerHTML = groups.map(g => `
        <div>
          <div class="text-slate-400 font-semibold mb-1.5">${g.title}</div>
          <div class="flex flex-wrap gap-1">
            ${g.items.map(it => `
              <button type="button" data-ref-jump="${it.id}" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-amber-500/20 hover:text-amber-300 text-slate-300 border border-slate-700/80 transition text-left truncate max-w-full">
                ${it.label}
              </button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

        let rbFontScaleLevel = 0; // 0: std, 1: lg, 2: xl
    function toggleRbTocDrawer(forceOpen) {
      const aside = document.getElementById('tocSidebarAside');
      const backdrop = document.getElementById('ipadTocBackdrop');
      if (!aside) return;
      const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : !aside.classList.contains('ipad-drawer-open');
      aside.classList.toggle('ipad-drawer-open', shouldOpen);
      if (backdrop) backdrop.classList.toggle('hidden', !shouldOpen);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const fontBtn = document.getElementById('ipadFontScaleBtn');
      if (fontBtn) {
        fontBtn.addEventListener('click', () => {
          const root = document.documentElement;
          root.classList.remove('ipad-font-lg', 'ipad-font-xl');
          rbFontScaleLevel = (rbFontScaleLevel + 1) % 3;
          if (rbFontScaleLevel === 1) {
            root.classList.add('ipad-font-lg');
            fontBtn.textContent = '🔎 A+ 大字 (115%)';
          } else if (rbFontScaleLevel === 2) {
            root.classList.add('ipad-font-xl');
            fontBtn.textContent = '🔎 A++ 特大 (130%)';
          } else {
            fontBtn.textContent = '🔎 A+ 桌邊大字';
          }
        });
      }
      const tocBtn = document.getElementById('ipadTocDrawerBtn');
      const closeTocBtn = document.getElementById('closeTocDrawerBtn');
      const tocBackdrop = document.getElementById('ipadTocBackdrop');
      if (tocBtn) tocBtn.addEventListener('click', () => toggleRbTocDrawer());
      if (closeTocBtn) closeTocBtn.addEventListener('click', () => toggleRbTocDrawer(false));
      if (tocBackdrop) tocBackdrop.addEventListener('click', () => toggleRbTocDrawer(false));
      buildSidebarIndex();
      renderFullRulebook('');

      const searchInput = document.getElementById('fullSearchInput');
      const clearBtn = document.getElementById('clearFullSearchBtn');
      searchInput.addEventListener('input', () => {
        const val = searchInput.value;
        clearBtn.classList.toggle('hidden', !val);
        renderFullRulebook(val);
      });
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        renderFullRulebook('');
      });

      document.getElementById('expandAllBtn').addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        renderFullRulebook('');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      document.getElementById('backToTopBtn').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      document.body.addEventListener('click', (e) => {
        const refBtn = e.target.closest('[data-ref-jump]');
        if (refBtn) {
          const targetId = refBtn.getAttribute('data-ref-jump');
          toggleRbTocDrawer(false);
          jumpToRuleId(targetId);
          return;
        }
        const secBtn = e.target.closest('[data-jump]');
        if (secBtn) {
          const secId = secBtn.getAttribute('data-jump');
          const el = document.getElementById(secId);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });

      // Check initial URL hash for automatic jump & highlight
      if (window.location.hash) {
        const hashId = decodeURIComponent(window.location.hash.substring(1));
        setTimeout(() => jumpToRuleId(hashId), 200);
      }
    });
  </script>
